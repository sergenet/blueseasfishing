<!doctype html>
<html lang="ru" dir="ltr"><head>
<script src="/assets/js/ad-gate.js?v=1" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Премиум активирован — Blue Seas Fishing</title>
<style>body{font:16px/1.6 system-ui;margin:0;background:#f8fafc;color:#0f172a}.card{max-width:650px;margin:10vh auto;background:#fff;padding:28px;border:1px solid #e2e8f0;border-radius:14px}.btn{display:inline-block;padding:10px 16px;background:#1d4ed8;color:#fff;text-decoration:none;border-radius:9px}.muted{color:#64748b}</style>  <script src="/analytics-consent.js?v=4" defer></script>
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
</script>
  <link rel="canonical" href="https://www.blueseasfishing.com/ru/premium-success.html">
</head>
<body><main class="card"><h1 id="title">Подтверждение вашего Премиум-доступа…</h1><p id="message" class="muted">Пожалуйста, оставьте эту страницу открытой.</p><a id="continue" class="btn" href="/ru/members-area.html" hidden>Продолжить в личный кабинет</a></main>
<script>
(async function(){
  const title=document.getElementById('title'), message=document.getElementById('message'), link=document.getElementById('continue');
  const sessionId=new URLSearchParams(location.search).get('session_id')||'';
  try {
    const response=await fetch('/api/billing.php?action=confirm&session_id='+encodeURIComponent(sessionId),{credentials:'include'});
    const result=await response.json();
    if(response.status===401){ location.assign('/login.html'); return; }
    if(!response.ok||!result.ok) throw new Error(result.error||'We could not confirm the payment.');
    title.textContent='Premium is active'; message.textContent='Thank you. Your account now has Premium access.'; link.hidden=false;
  } catch(error){ title.textContent='Payment confirmation needs attention'; message.textContent=error.message||'Please contact support.'; }
})();
</script><script src="/assets/js/nav-back.js?v=3" defer></script>  <script src="/assets/js/lang-switch.js?v=5" defer></script>
</body></html>
