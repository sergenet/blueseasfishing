# Codemagic cloud build — Blue Seas Fishing iOS
#
# Builds the native SwiftUI app in the cloud (no Mac needed), signs it with
# automatic App Store Connect signing, and uploads it to TestFlight.
#
# One-time dashboard setup (see ../IOS-SUBMISSION.md):
#   1. Push THIS FOLDER (ios-project/) to a private GitHub repo as the repo root.
#   2. codemagic.io -> Add application -> GitHub -> pick the repo
#      -> workflow "ios-workflow" -> macOS machine.
#   3. Add environment variables (Groups: "appstore_credentials"):
#        APP_STORE_CONNECT_ISSUER_ID  (App Store Connect -> Users and Access -> Integrations -> Keys)
#        APP_STORE_CONNECT_KEY_ID     (same page)
#        APP_STORE_CONNECT_PRIVATE_KEY (contents of the .p8 file, multi-line)
#      Also connect Apple Developer Portal in Codemagic (Team connections) and
#      enable "Automatic code signing".
#   4. Start build. TestFlight upload happens automatically on success.
#
# Note: the .xcodeproj is generated on the build machine from project.yml via
# xcodegen, so no binary project files live in the repo.

workflows:
  ios-workflow:
    name: Blue Seas Fishing iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.blueseasfishing.app
      # Automatic code signing via App Store Connect API key (group above).
    scripts:
      - name: Show tool versions
        script: |
          xcodebuild -version
          node --version
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build and sign IPA
        script: |
          set -e
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/BlueSeasFishing.xcodeproj" \
            --scheme BlueSeasFishing
    publishing:
      email:
        recipients:
          - sergenet@yahoo.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Docs: https://docs.codemagic.io/yaml-publishing/app-store-connect/
        # Key fields come from the appstore_credentials variable group and also
        # enable automatic code signing during the build.
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_ID
        private_key: $APP_STORE_CONNECT_PRIVATE_KEY

        # TestFlight distribution
        distribution:
          - testFlight
